<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RANCH Bakery — Owner Dashboard</title>
<style>
  :root{
    --bg:#0F1117;
    --surface:#181C25;
    --surface2:#1F2430;
    --surface3:#262C3A;
    --border:#2A3040;
    --accent:#4F8EF7;
    --accent-dim:rgba(79,142,247,0.15);
    --green:#2ECC71;
    --green-dim:rgba(46,204,113,0.15);
    --amber:#F5A623;
    --amber-dim:rgba(245,166,35,0.15);
    --red:#E74C3C;
    --red-dim:rgba(231,76,60,0.15);
    --text:#E8EAF0;
    --text-muted:#8A91A6;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #root{min-height:100vh;}
  a{color:var(--accent);}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}

  .app-shell{display:flex;min-height:100vh;}
  .sidebar{
    width:220px;flex-shrink:0;background:var(--surface);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:20px 14px;
    position:sticky;top:0;height:100vh;
  }
  .brand{padding:0 8px 20px 8px;border-bottom:1px solid var(--border);margin-bottom:16px;}
  .brand-title{font-size:15px;font-weight:700;letter-spacing:0.02em;}
  .brand-sub{font-size:11px;color:var(--text-muted);margin-top:2px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;
    font-size:13.5px;font-weight:500;color:var(--text-muted);cursor:pointer;margin-bottom:2px;
    border:1px solid transparent;user-select:none;
  }
  .nav-item:hover{background:var(--surface2);color:var(--text);}
  .nav-item.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(79,142,247,0.3);}
  .nav-badge{
    margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;
    padding:1px 6px;border-radius:20px;min-width:18px;text-align:center;
  }
  .conn-status{margin-top:auto;padding:10px 12px;font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:6px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;}
  .dot.off{background:var(--red);}

  .main{flex:1;min-width:0;padding:24px 28px 60px 28px;}
  .page-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:8px;}
  .page-title{font-size:20px;font-weight:700;}
  .page-sub{font-size:12.5px;color:var(--text-muted);margin-top:3px;}

  .grid{display:grid;gap:14px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:2fr 1fr;}
  @media (max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;}}
  @media (max-width:640px){.grid-4,.grid-3{grid-template-columns:1fr;}}

  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 18px;
  }
  .stat-card{display:flex;flex-direction:column;gap:6px;}
  .stat-label{font-size:11.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;font-weight:600;}
  .stat-value{font-size:26px;font-weight:700;}
  .stat-sub{font-size:11.5px;color:var(--text-muted);}

  .section-title{font-size:14px;font-weight:700;margin:0 0 12px 0;display:flex;align-items:center;justify-content:space-between;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{
    text-align:left;color:var(--text-muted);font-weight:600;font-size:11px;
    text-transform:uppercase;letter-spacing:0.03em;padding:8px 10px;border-bottom:1px solid var(--border);
  }
  td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover{background:var(--surface2);}

  .badge{
    display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;
    padding:3px 9px;border-radius:20px;white-space:nowrap;
  }
  .badge-pending{background:var(--amber-dim);color:var(--amber);}
  .badge-confirmed{background:var(--accent-dim);color:var(--accent);}
  .badge-baking{background:var(--amber-dim);color:var(--amber);}
  .badge-ready{background:var(--green-dim);color:var(--green);}
  .badge-fulfilled{background:rgba(46,204,113,0.08);color:#7fd9a4;}
  .badge-cancelled{background:var(--red-dim);color:var(--red);}
  .badge-muted{background:var(--surface3);color:var(--text-muted);}
  .badge-highvalue{background:var(--red-dim);color:var(--red);}

  .btn{
    background:var(--surface3);color:var(--text);border:1px solid var(--border);
    padding:7px 12px;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;
  }
  .btn:hover{border-color:var(--accent);}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .btn-accent{background:var(--accent);border-color:var(--accent);color:#0b1220;}
  .btn-accent:hover{filter:brightness(1.08);}
  .btn-green{background:var(--green);border-color:var(--green);color:#0b1220;}
  .btn-ghost{background:transparent;border-color:var(--border);}
  .btn-sm{padding:4px 9px;font-size:11.5px;}
  .btn-danger{background:transparent;border-color:var(--red);color:var(--red);}

  input,select,textarea{
    background:var(--surface2);border:1px solid var(--border);color:var(--text);
    padding:6px 9px;border-radius:6px;font-size:12.5px;font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
  input[type="number"]{width:90px;}

  .tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .tab{padding:8px 4px;margin-right:14px;font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;}
  .tab.active{color:var(--text);border-color:var(--accent);}

  .kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:start;}
  @media (max-width:1200px){.kanban{grid-template-columns:repeat(3,1fr);}}
  @media (max-width:700px){.kanban{grid-template-columns:1fr;}}

  .order-card-name{font-weight:600;margin-bottom:3px;}

  .empty-state{color:var(--text-muted);font-size:12.5px;padding:20px;text-align:center;}

  .batch-group{margin-bottom:20px;}
  .batch-head{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px;}
  .batch-head-left{display:flex;align-items:center;gap:10px;}
  .batch-date{font-size:16px;font-weight:700;}
  .bake-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .bake-chip{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;}
  .bake-chip b{color:var(--accent);}

  .drawer-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;justify-content:flex-end;
    z-index:100;
  }
  .drawer{
    width:460px;max-width:100%;height:100%;background:var(--surface);border-left:1px solid var(--border);
    padding:22px;overflow-y:auto;
  }
  @media (max-width:640px){.drawer{width:100%;}}
  .drawer-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
  .drawer-close{cursor:pointer;color:var(--text-muted);font-size:20px;line-height:1;background:none;border:none;}
  .drawer-close:hover{color:var(--text);}
  .field-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .field-label{color:var(--text-muted);}
  .field-value{font-weight:600;text-align:right;}
  .status-flow{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0;}

  .toast-wrap{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--surface3);border:1px solid var(--border);border-left:3px solid var(--accent);padding:10px 14px;border-radius:8px;font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,0.4);}
  .toast.err{border-left-color:var(--red);}
  .toast.ok{border-left-color:var(--green);}

  .loading-screen{display:flex;align-items:center;justify-content:center;height:100vh;color:var(--text-muted);font-size:13px;}
  .muted{color:var(--text-muted);}
  .mono{font-variant-numeric:tabular-nums;}
  .flex{display:flex;}
  .items-center{align-items:center;}
  .gap-8{gap:8px;}
  .divider{height:1px;background:var(--border);margin:14px 0;}
</style>

<!-- Safety net: if a CDN script above failed to load or anything throws before
     React ever mounts, this catches it and shows a real error message instead
     of a blank screen. Without this, an uncaught error just leaves #root
     empty with no clue what happened. -->
<script>
  window.addEventListener('error', function (e) {
    var root = document.getElementById('root');
    if (root && !root.hasChildNodes()) {
      var msg = (e && e.message) ? String(e.message) : 'Unknown error';
      var isExtensionModuleError = /appendChild/.test(msg) && /import statement outside a module/.test(msg);
      var explanation = isExtensionModuleError
        ? 'This specific error is not from this page — it\'s the signature of a browser extension (Grammarly, a crypto wallet, React DevTools, etc.) injecting a script incorrectly, which happens often on local file:// pages. Try Incognito/Private mode (extensions off by default) — if it loads clean there, disable extensions one at a time in your normal window until you find the culprit.'
        : 'A script failed before the app could load — usually a CDN script (React, Supabase, Chart.js) blocked or unreachable. Check your internet connection, or try disabling any ad blocker / content blocker for this page, then reload.';
      root.innerHTML =
        '<div style="padding:40px;max-width:640px;margin:0 auto;font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:#E8EAF0;background:#0F1117;min-height:100vh;">' +
        '<h2 style="margin-top:60px;">Dashboard couldn\'t start</h2>' +
        '<p style="color:#8A91A6;">' + explanation + '</p>' +
        '<p style="font-family:monospace;font-size:12.5px;color:#F5A623;background:#181C25;padding:12px;border-radius:8px;white-space:pre-wrap;">' +
        msg.replace(/</g, '&lt;') +
        '</p></div>';
    }
  });
</script>

/* ---------------------------------------------------------------------
   Helpers
--------------------------------------------------------------------- */
function fmtMoney(n) {
  const v = Number(n || 0);
  return v.toLocaleString("en-US", { style: "currency", currency: "USD" });
}
// Postgres `date` columns (delivery_date, requested_date) come back as bare
// "YYYY-MM-DD" strings with no timezone. `new Date("2026-08-04")` parses that
// as UTC midnight, which — for a Florida (Eastern) browser — can silently
// roll it back to Monday. Every date-only value in this app must go through
// this parser so "Tuesday" always means Tuesday, regardless of the viewer's
// timezone or time of day.
function toLocalDate(d) {
  // Always returns a *new* Date — several callers (startOfWeek, nextTuesdayFrom)
  // mutate the returned object in place, so this must never hand back a
  // reference the caller still holds elsewhere (e.g. a shared `now`).
  if (d instanceof Date) return new Date(d.getTime());
  const s = String(d);
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  return new Date(s);
}
function dateKey(d) {
  const dt = toLocalDate(d);
  const y = dt.getFullYear();
  const mo = String(dt.getMonth() + 1).padStart(2, "0");
  const da = String(dt.getDate()).padStart(2, "0");
  return y + "-" + mo + "-" + da;
}
function fmtDate(d) {
  if (!d) return "—";
  const dt = toLocalDate(d);
  if (isNaN(dt)) return String(d);
  return dt.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
}
function fmtDateTime(d) {
  if (!d) return "—";
  const dt = new Date(d);
  if (isNaN(dt)) return String(d);
  return dt.toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}
function timeAgo(d) {
  if (!d) return "—";
  const diff = (Date.now() - new Date(d).getTime()) / 1000;
  if (diff < 60) return "just now";
  if (diff < 3600) return Math.floor(diff / 60) + "m ago";
  if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
  return Math.floor(diff / 86400) + "d ago";
}
function startOfWeek(d) {
  const dt = toLocalDate(d); const day = dt.getDay();
  const diff = (day === 0 ? -6 : 1) - day; // Monday start
  dt.setDate(dt.getDate() + diff); dt.setHours(0, 0, 0, 0); return dt;
}
function endOfWeek(d) {
  const s = startOfWeek(d); const e = new Date(s); e.setDate(e.getDate() + 6); e.setHours(23, 59, 59, 999); return e;
}
function nextTuesdayFrom(d) {
  const dt = toLocalDate(d); dt.setHours(0, 0, 0, 0);
  const day = dt.getDay(); // Tue = 2
  const diff = (2 - day + 7) % 7;
  dt.setDate(dt.getDate() + diff);
  return dt;
}
// Mirrors the DB trigger (compute_order_delivery_date): the cutoff for a given
// Tuesday's batch is the Friday before it at 8pm. If "now" is past that
// cutoff, the order rolls to the following Tuesday instead. Used so the
// dashboard's own labels/defaults agree with what the database will actually
// assign new orders.
function computeAssignedTuesday(from = new Date()) {
  const tue = nextTuesdayFrom(from);
  const cutoff = new Date(tue);
  cutoff.setDate(cutoff.getDate() - 4); // Friday before
  cutoff.setHours(20, 0, 0, 0);
  if (from > cutoff) tue.setDate(tue.getDate() + 7);
  return tue;
}
function isoDateOnly(d) { return dateKey(d); }
function weekKey(d) {
  return dateKey(startOfWeek(d));
}
function monthKey(d) {
  const dt = toLocalDate(d);
  return dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0");
}
function monthLabel(key) {
  const [y, m] = key.split("-").map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString("en-US", { month: "short", year: "2-digit" });
}
function startOfMonth(d) { const dt = toLocalDate(d); dt.setDate(1); dt.setHours(0, 0, 0, 0); return dt; }
function startOfYear(d) { const dt = toLocalDate(d); dt.setMonth(0, 1); dt.setHours(0, 0, 0, 0); return dt; }

/* ---------------------------------------------------------------------
   Toasts
--------------------------------------------------------------------- */
let toastId = 0;
function useToasts() {
  const [toasts, setToasts] = useState([]);
  const push = useCallback((msg, type = "ok") => {
    const id = ++toastId;
    setToasts(t => [...t, { id, msg, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3500);
  }, []);
  return [toasts, push];
}

/* ---------------------------------------------------------------------
   Data layer: fetch + realtime
--------------------------------------------------------------------- */
function useBakeryData(onError) {
  const [products, setProducts] = useState([]);
  const [customers, setCustomers] = useState([]);
  const [orders, setOrders] = useState([]);
  const [alerts, setAlerts] = useState([]);
  const [rewards, setRewards] = useState([]);
  const [loading, setLoading] = useState(true);
  const [connected, setConnected] = useState(false);

  // `onError` is typically passed as an inline arrow function by the caller,
  // which is a new function identity on every render. If fetchAll depended on
  // it directly, fetchAll would also change identity every render, which would
  // retrigger the effects below (initial fetch + realtime subscribe) every
  // render — an infinite fetch loop. Route it through a ref instead so
  // fetchAll's identity is stable regardless of what the caller passes in.
  const onErrorRef = useRef(onError);
  useEffect(() => { onErrorRef.current = onError; }, [onError]);

  const fetchAll = useCallback(async () => {
    try {
      const [p, c, o, a, r] = await Promise.all([
        sb.from("products").select("*").order("name"),
        sb.from("customers").select("*").order("name"),
        sb.from("orders").select("*, order_items(*)").order("delivery_date", { ascending: true }),
        sb.from("alerts").select("*").order("created_at", { ascending: false }),
        sb.from("customer_rewards").select("*").order("earned_at", { ascending: false })
      ]);
      if (p.error) throw p.error;
      if (c.error) throw c.error;
      if (o.error) throw o.error;
      if (a.error) throw a.error;
      if (r.error) throw r.error;
      setProducts(p.data || []);
      setCustomers(c.data || []);
      setOrders(o.data || []);
      setAlerts(a.data || []);
      setRewards(r.data || []);
    } catch (e) {
      console.error(e);
      onErrorRef.current && onErrorRef.current("Couldn't load data: " + e.message);
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { fetchAll(); }, [fetchAll]);

  useEffect(() => {
    let debounceTimer = null;
    const debouncedRefetch = () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(fetchAll, 250);
    };
    const channel = sb.channel("crm-realtime")
      .on("postgres_changes", { event: "*", schema: "public", table: "orders" }, debouncedRefetch)
      .on("postgres_changes", { event: "*", schema: "public", table: "order_items" }, debouncedRefetch)
      .on("postgres_changes", { event: "*", schema: "public", table: "alerts" }, debouncedRefetch)
      .on("postgres_changes", { event: "*", schema: "public", table: "products" }, debouncedRefetch)
      .on("postgres_changes", { event: "*", schema: "public", table: "customers" }, debouncedRefetch)
      .on("postgres_changes", { event: "*", schema: "public", table: "customer_rewards" }, debouncedRefetch)
      .subscribe((status) => setConnected(status === "SUBSCRIBED"));
    return () => { clearTimeout(debounceTimer); sb.removeChannel(channel); };
  }, [fetchAll]);

  return { products, customers, orders, alerts, rewards, loading, connected, refetch: fetchAll };
}

/* ---------------------------------------------------------------------

--------------------------------------------------------------------- */
function StatusBadge({ status }) {
  return <span className={"badge badge-" + (status || "pending")}>{STATUS_LABEL[status] || status}</span>;
}
function FulfillmentBadge({ fulfillment }) {
  return <span className="badge badge-muted">{fulfillment === "delivery" ? "🚗 Delivery" : "🏠 Pickup"}</span>;
}
function Toasts({ toasts }) {
  return (
    <div className="toast-wrap">
      {toasts.map(t => <div key={t.id} className={"toast " + t.type}>{t.msg}</div>)}
    </div>
  );
}

/* ---------------------------------------------------------------------
   Status change modal — requires a reason before any manual status
   change commits. The reason requirement is also enforced server-side
   (see update_order_status RPC), so this isn't just a UI nicety — the
   database itself rejects an empty reason.
--------------------------------------------------------------------- */
function StatusChangeModal({ order, newStatus, onConfirm, onCancel }) {
  const [reason, setReason] = useState("");
  const [saving, setSaving] = useState(false);
  const trimmed = reason.trim();

  const submit = async (e) => {
    e.preventDefault();
    if (!trimmed) return;
    setSaving(true);
    await onConfirm(trimmed);
    setSaving(false);
  };

  return (
    <div className="drawer-overlay" onClick={onCancel}>
      <form className="card" style={{ width: 380 }} onClick={e => e.stopPropagation()} onSubmit={submit}>
        <div className="drawer-head" style={{ marginBottom: 10 }}>
          <div style={{ fontSize: 15, fontWeight: 700 }}>Order #{order.id} → {STATUS_LABEL[newStatus]}</div>
          <button type="button" className="drawer-close" onClick={onCancel}>✕</button>
        </div>
        <div className="muted" style={{ fontSize: 12, marginBottom: 12 }}>
          {order.customer_name} · currently {STATUS_LABEL[order.status]}
        </div>
        <div style={{ marginBottom: 16 }}>
          <div className="field-label" style={{ marginBottom: 4 }}>
            Why are you making this change? <span style={{ color: "var(--red)" }}>*</span>
          </div>
          <textarea
            style={{ width: "100%" }}
            rows="3"
            value={reason}
            onChange={e => setReason(e.target.value)}
            placeholder="e.g. Marked baking by mistake, moving back to confirmed"
            autoFocus
            required
          />
          <div className="muted" style={{ fontSize: 11, marginTop: 4 }}>
            Logged to this order's history with your account and the time, so you can always tell what you changed versus anything that happened outside the dashboard.
          </div>
        </div>
        <div className="flex gap-8">
          <button type="button" className="btn btn-ghost" style={{ flex: 1 }} onClick={onCancel}>Cancel</button>
          <button className="btn btn-accent" style={{ flex: 1 }} disabled={saving || !trimmed} type="submit">
            {saving ? "Saving…" : "Confirm change"}
          </button>
        </div>
      </form>
    </div>
  );
}

--------------------------------------------------------------------- */
function OrderDrawer({ order, onClose, onRequestStatusChange, alerts, customers, rewards, pushToast, refetch }) {
  const [comms, setComms] = useState([]);
  const [commsLoading, setCommsLoading] = useState(true);
  useEffect(() => {
    let active = true;
    setCommsLoading(true);
    sb.from("communications").select("*").eq("order_id", order.id).order("sent_at", { ascending: false })
      .then(({ data, error }) => { if (active) { setComms(error ? [] : (data || [])); setCommsLoading(false); } });
    return () => { active = false; };
  }, [order.id]);

  const [statusLog, setStatusLog] = useState([]);
  const [statusLogLoading, setStatusLogLoading] = useState(true);
  useEffect(() => {
    let active = true;
    setStatusLogLoading(true);
    sb.from("order_status_log").select("*").eq("order_id", order.id).order("created_at", { ascending: false })
      .then(({ data, error }) => { if (active) { setStatusLog(error ? [] : (data || [])); setStatusLogLoading(false); } });
    return () => { active = false; };
  }, [order.id]);

  const items = order.order_items || [];
  const relatedAlerts = alerts.filter(a => a.order_id === order.id);
  const requestedWeek = order.requested_date ? weekKey(order.requested_date) : null;
  const deliveryWeek = order.delivery_date ? weekKey(order.delivery_date) : null;
  const rolled = requestedWeek && deliveryWeek && requestedWeek !== deliveryWeek;
  const currentIdx = STATUS_FLOW.indexOf(order.status);

  // ── Discount / comp editing ──
  const subtotal = items.reduce((s, it) => s + Number(it.subtotal || 0), 0);
  const [discountAmount, setDiscountAmount] = useState(order.discount_amount || 0);
  const [discountReason, setDiscountReason] = useState(order.discount_reason || "");
  const [savingDiscount, setSavingDiscount] = useState(false);
  useEffect(() => {
    setDiscountAmount(order.discount_amount || 0);
    setDiscountReason(order.discount_reason || "");
  }, [order.id]);

  // Resolve which saved customer this order belongs to (same fallback the
  // rest of the app uses: linked customer_id, else match by email) so we can
  // check whether they have an unredeemed punch-card reward.
  const resolvedCustomerId = order.customer_id ||
    (order.customer_email ? (customers || []).find(c => (c.email || "").toLowerCase() === order.customer_email.toLowerCase())?.id : null) ||
    null;
  const unredeemedReward = resolvedCustomerId
    ? (rewards || []).find(r => r.customer_id === resolvedCustomerId && !r.redeemed)
    : null;

  const applyCreditReward = () => {
    setDiscountAmount(10);
    setDiscountReason(`Punch-card reward — $10 credit (${unredeemedReward.milestone} pts)`);
  };
  const applyLoafReward = () => {
    // Which item is "the specialty loaf" varies by order, so this doesn't
    // guess a dollar amount — just sets the reason and leaves the amount for
    // you to fill in as half that loaf's price.
    setDiscountReason(`Punch-card reward — 50% off specialty loaf (${unredeemedReward.milestone} pts)`);
    pushToast("Enter half the specialty loaf's price as the discount amount.", "ok");
  };

  const saveDiscount = async () => {
    const amt = Number(discountAmount) || 0;
    if (amt > 0 && !discountReason.trim()) { pushToast("Add a reason for the discount/comp.", "err"); return; }
    setSavingDiscount(true);
    await ensureFreshSession();
    const newTotal = Math.max(0, subtotal - amt);
    const { error } = await sb.from("orders").update({
      discount_amount: amt,
      discount_reason: amt > 0 ? discountReason.trim() : null,
      total: newTotal
    }).eq("id", order.id);
    if (error) { setSavingDiscount(false); pushToast("Couldn't save discount: " + error.message, "err"); return; }

    // If this discount is redeeming a punch-card reward, mark it redeemed
    // and link it to this order.
    if (amt > 0 && unredeemedReward && discountReason.trim().startsWith("Punch-card reward")) {
      await sb.from("customer_rewards").update({
        redeemed: true, redeemed_at: new Date().toISOString(), redeemed_order_id: order.id
      }).eq("id", unredeemedReward.id);
    }

    setSavingDiscount(false);
    pushToast("Order #" + order.id + " updated", "ok");
    refetch();
  };

  return (
    <div className="drawer-overlay" onClick={onClose}>
      <div className="drawer" onClick={e => e.stopPropagation()}>
        <div className="drawer-head">
          <div>
            <div style={{ fontSize: 17, fontWeight: 700 }}>Order #{order.id}</div>
            <div className="muted" style={{ fontSize: 12, marginTop: 2 }}>Placed {fmtDateTime(order.created_at)}</div>
          </div>
          <button className="drawer-close" onClick={onClose}>✕</button>
        </div>

        <div className="flex gap-8 items-center" style={{ marginBottom: 4 }}>
          <StatusBadge status={order.status} />
          <FulfillmentBadge fulfillment={order.fulfillment} />
          {order.total >= HIGH_VALUE_THRESHOLD && <span className="badge badge-highvalue">⚡ High value</span>}
        </div>

        {order.status !== "cancelled" && (
          <div className="status-flow">
            {STATUS_FLOW.map((s, i) => (
              <button key={s} className={"btn btn-sm " + (s === order.status ? "btn-accent" : "btn-ghost")}
                disabled={s === order.status}
                title={i < currentIdx ? "Move back to " + STATUS_LABEL[s] : undefined}
                onClick={() => onRequestStatusChange(order, s)}>
                {STATUS_LABEL[s]}
              </button>
            ))}
            <button className="btn btn-sm btn-danger" onClick={() => onRequestStatusChange(order, "cancelled")}>Cancel order</button>
          </div>
        )}
        {order.status === "cancelled" && (
          <div style={{ margin: "14px 0" }}>
            <button className="btn btn-sm" onClick={() => onRequestStatusChange(order, "pending")}>Reinstate as pending</button>
          </div>
        )}

        <div className="divider" />
        <div className="field-row"><span className="field-label">Customer</span><span className="field-value">{order.customer_name || "—"}</span></div>
        <div className="field-row"><span className="field-label">Email</span><span className="field-value">{order.customer_email || "—"}</span></div>
        <div className="field-row"><span className="field-label">Phone</span><span className="field-value">{order.customer_phone || "—"}</span></div>
        <div className="field-row"><span className="field-label">Fulfillment</span><span className="field-value">{order.fulfillment || "pickup"}</span></div>
        {order.fulfillment === "delivery" && (
          <div className="field-row"><span className="field-label">Delivery location</span><span className="field-value">{order.delivery_location || "—"}</span></div>
        )}
        <div className="field-row"><span className="field-label">Requested date</span><span className="field-value">{fmtDate(order.requested_date)}</span></div>
        <div className="field-row">
          <span className="field-label">Delivery (Tuesday)</span>
          <span className="field-value">{fmtDate(order.delivery_date)} {rolled && <span className="badge badge-muted" style={{ marginLeft: 6 }}>rolled from Fri cutoff</span>}</span>
        </div>
        <div className="field-row"><span className="field-label">Payment method</span><span className="field-value">{order.payment_method || "—"}</span></div>

        <div className="divider" />
        <div className="section-title" style={{ marginBottom: 8 }}>Items</div>
        <table>
          <thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Subtotal</th></tr></thead>
          <tbody>
            {items.length === 0 && <tr><td colSpan="4" className="muted">No line items</td></tr>}
            {items.map(it => (
              <tr key={it.id}>
                <td>{it.product_name}</td>
                <td>{it.quantity}</td>
                <td>{fmtMoney(it.unit_price)}</td>
                <td>{fmtMoney(it.subtotal)}</td>
              </tr>
            ))}
          </tbody>
        </table>
        <div className="flex" style={{ justifyContent: "space-between", marginTop: 8, fontSize: 12.5, color: "var(--text-muted)" }}>
          <span>Item subtotal</span><span>{fmtMoney(subtotal)}</span>
        </div>
        {Number(order.discount_amount || 0) > 0 && (
          <div className="flex" style={{ justifyContent: "space-between", fontSize: 12.5, color: "var(--text-muted)" }}>
            <span>Discount/comp{order.discount_reason ? " — " + order.discount_reason : ""}</span><span>−{fmtMoney(order.discount_amount)}</span>
          </div>
        )}
        <div className="flex" style={{ justifyContent: "flex-end", marginTop: 4, fontWeight: 700 }}>
          Total: {fmtMoney(order.total)}
        </div>

        <div className="divider" />
        <div className="section-title">Discount / comp</div>
        {unredeemedReward && (
          <div style={{ background: "var(--green-dim)", border: "1px solid rgba(46,204,113,0.3)", borderRadius: 8, padding: "10px", marginBottom: 10, fontSize: 12.5 }}>
            <div style={{ marginBottom: 8 }}>🎁 This customer has an unredeemed reward ({unredeemedReward.milestone} pts / ${unredeemedReward.milestone * 10} spent)</div>
            <div className="flex gap-8">
              <button type="button" className="btn btn-sm btn-green" onClick={applyCreditReward}>$10 credit</button>
              <button type="button" className="btn btn-sm btn-green" onClick={applyLoafReward}>50% off specialty loaf</button>
            </div>
          </div>
        )}
        <div className="flex gap-8" style={{ marginBottom: 8 }}>
          <div style={{ flex: 1 }}>
            <div className="field-label" style={{ marginBottom: 4 }}>Discount / comp amount ($)</div>
            <input type="number" step="0.01" min="0" style={{ width: "100%" }} value={discountAmount}
              onChange={e => setDiscountAmount(e.target.value)} />
          </div>
        </div>
        <div style={{ marginBottom: 10 }}>
          <div className="field-label" style={{ marginBottom: 4 }}>Reason</div>
          <input style={{ width: "100%" }} value={discountReason} onChange={e => setDiscountReason(e.target.value)}
            placeholder="e.g. Punch-card reward, goodwill discount, pricing mistake" />
        </div>
        <button className="btn btn-sm btn-accent" disabled={savingDiscount} onClick={saveDiscount}>
          {savingDiscount ? "Saving…" : "Save discount / comp"}
        </button>

        {order.notes && (
          <React.Fragment>
            <div className="divider" />
            <div className="section-title">Notes</div>
            <div style={{ fontSize: 13, color: "var(--text)", background: "var(--surface2)", padding: 10, borderRadius: 8 }}>{order.notes}</div>
          </React.Fragment>
        )}

        {relatedAlerts.length > 0 && (
          <React.Fragment>
            <div className="divider" />
            <div className="section-title">Alerts on this order</div>
            {relatedAlerts.map(a => (
              <div key={a.id} className="field-row">
                <span className="field-label">{a.type}{a.resolved ? " (resolved)" : ""}</span>
                <span className="field-value" style={{ fontWeight: 400 }}>{a.message}</span>
              </div>
            ))}
          </React.Fragment>
        )}

        <div className="divider" />
        <div className="section-title">Status history</div>
        {statusLogLoading ? <div className="muted">Loading…</div> :
          statusLog.length === 0 ? <div className="muted">No status changes logged yet.</div> :
          statusLog.map(l => (
            <div key={l.id} className="field-row" style={{ display: "block" }}>
              <div className="flex" style={{ justifyContent: "space-between" }}>
                <span>{l.old_status ? (STATUS_LABEL[l.old_status] || l.old_status) : "—"} → <b>{STATUS_LABEL[l.new_status] || l.new_status}</b></span>

              </div>
              <div className="muted" style={{ fontSize: 11.5, marginTop: 2 }}>
                {l.source === "dashboard" ? l.changed_by : "Changed outside the dashboard"}
                {l.source !== "dashboard" && <span className="badge badge-muted" style={{ marginLeft: 6 }}>no reason logged</span>}
              </div>
              {l.reason && <div style={{ marginTop: 4 }}>{l.reason}</div>}
            </div>
          ))
        }

        <div className="divider" />
        <div className="section-title">Communications</div>
        {commsLoading ? <div className="muted">Loading…</div> :
          comms.length === 0 ? <div className="muted">No logged communications for this order.</div> :
          comms.map(c => (
            <div key={c.id} className="field-row" style={{ display: "block" }}>
              <div className="flex" style={{ justifyContent: "space-between" }}>
                <span className="badge badge-muted">{c.type || "note"}</span>
                <span className="muted" style={{ fontSize: 11 }}>{fmtDateTime(c.sent_at)}</span>
              </div>
              <div style={{ marginTop: 4 }}>{c.message}</div>
            </div>
          ))
        }
      </div>
    </div>
  );
}
